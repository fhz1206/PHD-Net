# GitCode Action 流水线（https://docs.gitcode.com/docs/help/home/org_project/pipeline/quick-start）
# Workflow 目录：.gitcode/workflows/（注意：不是 .workflow/ 或 .github/workflows/）
# 与 .github/workflows/ci.yml（GitHub 镜像）同一套测试。
name: PHD-Net CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

env:
  PYTHONUNBUFFERED: "1"

defaults:
  run:
    shell: bash

jobs:
  regression:
    name: 回归 + 逐位对拍
    runs-on: [ubuntu-latest]
    steps:
      - name: Checkout
        uses: checkout
      - name: 安装依赖（numpy / numba / pyarrow / psutil）
        run: |
          python -m pip install --upgrade uv
          python -m uv python install 3.14
          python -m uv venv --python 3.14 .venv-ci
          python -m uv pip install --python .venv-ci/bin/python pip
          # Python 3.14：使用本地验证过的 numpy/numba 配对；与 GitHub 一致。
          .venv-ci/bin/python -m pip install "numpy==2.5.2" "numba==0.67.0" "Cython==3.3.0" setuptools pyarrow psutil
          .venv-ci/bin/python -c "import sys; assert sys.version_info[:2] == (3, 14), sys.version"
      - name: 构建并强制加载 Cython
        run: |
          .venv-ci/bin/python setup_cython.py build_ext --inplace
          .venv-ci/bin/python -c "from phdnet.cykernels import get_kernels; assert get_kernels('force') is not None"
      - name: Cython 与审计修复门禁
        run: |
          .venv-ci/bin/python tests/verifiers/verify_cython_loader.py
          .venv-ci/bin/python tests/verifiers/verify_cykernels.py
          .venv-ci/bin/python tests/verifiers/verify_cython_switch.py
          .venv-ci/bin/python tests/verifiers/verify_stdp_parity.py
          .venv-ci/bin/python tests/verifiers/verify_eval_readonly.py
          .venv-ci/bin/python tests/verifiers/verify_wm_modulator.py
          .venv-ci/bin/python tests/verifiers/verify_perf_no_regression.py
          .venv-ci/bin/python tests/verifiers/verify_cann_dispatch.py
          .venv-ci/bin/python tests/verifiers/verify_overlap_contract.py
          .venv-ci/bin/python -m compileall -q phdnet train tools
          .venv-ci/bin/python train/train.py --help
          .venv-ci/bin/python train/infer.py --help
      - name: fast 回归（9 项，零回归门槛）
        run: .venv-ci/bin/python tests/run_tests.py fast
      - name: 分词器向量化逐位对拍
        run: .venv-ci/bin/python tests/verifiers/verify_seg_equiv.py
      - name: 词表并行构建逐位对拍
        run: .venv-ci/bin/python tests/verifiers/verify_vocab_parallel.py
      - name: 并行核 / 多进程流逐位一致性
        run: .venv-ci/bin/python tests/verifiers/verify_parallel_consistency.py

  torch-backend:
    name: torch 栈（CPU 参考路径）
    runs-on: [ubuntu-latest]
    steps:
      - name: Checkout
        uses: checkout
      - name: 安装依赖（含 CPU 版 torch）
        run: |
          python -m pip install --upgrade uv
          python -m uv python install 3.14
          python -m uv venv --python 3.14 .venv-ci
          python -m uv pip install --python .venv-ci/bin/python pip
          # Python 3.14：使用本地验证过的 numpy/numba 配对；与 GitHub 一致。
          .venv-ci/bin/python -m pip install "numpy==2.5.2" "numba==0.67.0" "Cython==3.3.0" setuptools pyarrow psutil
          .venv-ci/bin/python -c "import sys; assert sys.version_info[:2] == (3, 14), sys.version"
          .venv-ci/bin/python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      # ⚠ 2026-10-07 修复：checks_backend 里没有 t_torch_equivalence /
      #   t_torch_model_smoke（旧 torch 栈随 P30 删除）→ 原步骤必 ImportError。
      #   改跑实际存在的后端探测 + 读出加速臂等价性门禁。
      - name: 后端探测 + 读出加速臂等价性
        run: |
          .venv-ci/bin/python -c "import sys; sys.path.insert(0, 'tests'); \
            from checks_backend import t_backend_probe; t_backend_probe(); \
            print('backend probe PASS')"
          .venv-ci/bin/python tests/verifiers/verify_accel_readout.py

  precision:
    name: 精度体系验证（P9）
    runs-on: [ubuntu-latest]
    needs: [regression]
    steps:
      - name: Checkout
        uses: checkout
      - name: 安装依赖
        run: |
          python -m pip install --upgrade uv
          python -m uv python install 3.14
          python -m uv venv --python 3.14 .venv-ci
          python -m uv pip install --python .venv-ci/bin/python pip
          # Python 3.14：使用本地验证过的 numpy/numba 配对；与 GitHub 一致。
          .venv-ci/bin/python -m pip install "numpy==2.5.2" "numba==0.67.0" "Cython==3.3.0" setuptools pyarrow psutil
          .venv-ci/bin/python -c "import sys; assert sys.version_info[:2] == (3, 14), sys.version"
      - name: 精度审计（L1 位算法逐位 / L2 带宽 / L3 端到端）
        run: .venv-ci/bin/python tools/audit_precision.py
