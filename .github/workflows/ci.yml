name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy numba pyarrow psutil

      - name: Run tests (fast + 逐位对拍 + 精度验证)
        run: python ci/run_tests.py

  backend-torch:
    # 硬件后端适配验证：CPU torch 路径（CUDA/NPU/ROCm 需对应硬件 runner，
    # 见 docs/PHD-Net_硬件后端适配报告.md 的启用条件）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install torch (CPU) + deps
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy
      - name: Device probe + readout bench (CPU 参考)
        run: python tools/bench_accel.py --steps 20
      - name: STDP torch 等价性自检
        run: python -c "from phdnet.torch_backend import selftest_torch; assert selftest_torch('cpu'); print('selftest PASS')"
